name: Case Radar CI

on:
  push:
    branches:
      - agent/case-radar-implementation
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dark_content_radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d dark_content_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://radar:radar@localhost:5432/dark_content_radar
      USE_POSTGRES: "true"
      YOUTUBE_API_KEY: ""
      HF_TOKEN: ""
      CASE_RADAR_X_SESSION_FILE: ""
      X_BEARER_TOKEN: ""
      TIKTOK_ACCESS_TOKEN: ""
      INSTAGRAM_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Migration smoke
        run: alembic upgrade head
      - name: Case Radar targeted suite
        run: >-
          python -m pytest -q
          src/test_case_radar_models.py
          src/test_case_radar_repository.py
          src/test_case_radar_api.py
          src/test_case_radar_query_generator.py
          src/test_case_radar_providers.py
          src/test_case_radar_web_search.py
          src/test_case_radar_youtube.py
          src/test_case_radar_reddit.py
          src/test_case_radar_x.py
          src/test_case_radar_social_platforms.py
          src/test_case_radar_social_context.py
          src/test_case_radar_clustering.py
          src/test_case_radar_provenance.py
          src/test_case_radar_dossier.py
          src/test_case_radar_reference_service.py
          src/test_case_radar_orchestrator.py
          src/test_case_radar_social_source_promotion.py
          src/test_case_worker_bootstrap.py
          src/test_case_worker_protocol.py
      - name: Speech regression suite
        run: >-
          python -m pytest -q
          src/test_speech_job_models.py
          src/test_speech_job_repository.py
          src/test_speech_jobs_service.py
          src/test_speech_worker_bootstrap.py
          src/test_speech_result_importer.py
          src/test_speech_api.py
      - name: Full backend suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable env
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config
